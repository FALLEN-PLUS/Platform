<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- 天青与月白丝绸渐变 (Liang Zhu Azure & White Silk) -->
    <linearGradient id="silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F0F9FF"/>
      <stop offset="75%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 扇面立体折光 (Pleat Depth) -->
    <linearGradient id="pleat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25"/>
    </linearGradient>

    <!-- 香槟金丝滚边 (Champagne Gold Trim) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- 翡翠玉扣渐变 (Jade Pivot) -->
    <linearGradient id="jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 天青丝绦流苏 (Azure Tassel) -->
    <linearGradient id="tassel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- 1. 扇面主体（以扇喻蝶 · 柔美弧面） -->
  <path d="M 3 16 C 5.5 5.5, 26.5 5.5, 29 16 C 24 18.5, 19.5 17, 16 18 C 12.5 17, 8 18.5, 3 16 Z" 
        fill="url(#silk)"/>

  <!-- 2. 简洁大气的 5 瓣立体扇折（无杂乱线条，纯色块起伏） -->
  <path d="M 3 16 Q 10 7, 16 18 Z" fill="#FFFFFF" opacity="0.65"/>
  <path d="M 8.5 11 Q 13 6.5, 16 18 Z" fill="#0284C7" opacity="0.18"/>
  <path d="M 13.5 7.5 Q 16 6, 16 18 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M 18.5 7.5 Q 16 6, 16 18 Z" fill="#0284C7" opacity="0.12"/>
  <path d="M 23.5 11 Q 19 6.5, 16 18 Z" fill="#FFFFFF" opacity="0.65"/>
  <path d="M 29 16 Q 22 7, 16 18 Z" fill="#0284C7" opacity="0.25"/>

  <!-- 3. 优雅金丝顶边 (纤细灵动) -->
  <path d="M 3 16 C 5.5 5.5, 26.5 5.5, 29 16" 
        fill="none" stroke="url(#gold)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 4. 左右两根主扇骨 (极简大边) -->
  <line x1="16" y1="20" x2="3" y2="16" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="29" y2="16" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 5. 扇心翡翠玉纽 (Jade Ring) -->
  <circle cx="16" cy="20" r="2.0" fill="url(#jade)" stroke="url(#gold)" stroke-width="0.6"/>
  <circle cx="16" cy="20" r="0.7" fill="#FFFFFF"/>

  <!-- 6. 极简灵动的天青丝绸流苏 (Flowing Silk Tassel) -->
  <path d="M 15 22.5 L 14.2 28.8 C 14.2 29.8, 15.2 30.5, 16 30.5 C 16.8 30.5, 17.8 29.8, 17.8 28.8 L 17 22.5 Z" 
        fill="url(#tassel)"/>
  <rect x="14.8" y="22" width="2.4" height="0.9" rx="0.3" fill="url(#gold)"/>
</svg>